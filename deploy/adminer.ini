; Local-only PHP runtime for Adminer. Paths are supplied by start-local.ps1.
extension=pgsql
extension=pdo_pgsql
extension=openssl
extension=mbstring
date.timezone=UTC
expose_php=Off
display_errors=Off
log_errors=On
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
upload_max_filesize=32M
post_max_size=33M
memory_limit=128M
